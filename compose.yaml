services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_DB: stockroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - stockroom-data:/var/lib/postgresql/data
volumes:
  stockroom-data:
